apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "agentberth.sandbox" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentberth.name" . }}-worker
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentberth-run
  namespace: {{ include "agentberth.sandbox" . }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentberth.name" . }}-worker
  namespace: {{ include "agentberth.sandbox" . }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentberth.name" . }}-worker
  namespace: {{ include "agentberth.sandbox" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agentberth.name" . }}-worker
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "agentberth.name" . }}-worker
  apiGroup: rbac.authorization.k8s.io
