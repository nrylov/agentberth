apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentberth.name" . }}-api
spec:
  selector: {app: {{ include "agentberth.name" . }}-api}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentberth.name" . }}-api
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ include "agentberth.name" . }}-api}
  template:
    metadata:
      labels: {app: {{ include "agentberth.name" . }}-api}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "agentberth.security" . | nindent 8 }}
      imagePullSecrets: {{ .Values.imagePullSecrets | toJson }}
      containers:
        - name: api
          image: {{ .Values.images.platform | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- include "agentberth.containerSecurity" . | nindent 12 }}
          env:
            - {name: MAX_CONCURRENT_RUNS, value: {{ .Values.execution.maxConcurrentRuns | quote }}}
            - {name: MAX_QUEUED_RUNS, value: {{ .Values.execution.maxQueuedRuns | quote }}}
            - {name: EXECUTION_BACKEND, value: kubernetes}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: DATABASE_URL}}
            - name: ADMIN_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: ADMIN_KEY}}
            - name: LLM_API_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: LLM_API_KEY}}
            - {name: LLM_BASE_URL, value: {{ .Values.llm.baseUrl | quote }}}
            - {name: LLM_MODEL, value: {{ .Values.llm.model | quote }}}
          ports: [{containerPort: 8080, name: http}]
          resources: {{ .Values.api.resources | toJson }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 15
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 16Mi}}]
